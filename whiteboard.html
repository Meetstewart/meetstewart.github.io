<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stewart Whiteboard - Brainstorm</title>
<link rel="icon" type="image/png" href="stew-wave.png">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d0d0d;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#1a1a1a;border-bottom:1px solid #333}
.logo{font-size:20px;font-weight:700;color:#D4AF37}
.tabs{display:flex;gap:4px}
.tab{padding:10px 28px;border:none;background:transparent;color:#888;border-radius:10px;cursor:pointer;font-weight:600;transition:all .2s}
.tab:hover{background:#333}
.tab.active{background:#D4AF37;color:#0d0d0d}
.voice-btn.recording{background:#ef4444!important;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:280px;background:#1a1a1a;border-right:1px solid #333;padding:16px;overflow-y:auto}
.sidebar h3{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:16px 0 12px}
.sidebar h3:first-child{margin-top:0}
.sidebar button{width:100%;padding:12px;margin-bottom:8px;border:none;background:#242424;color:#fff;border-radius:10px;font-weight:500;cursor:pointer;transition:all .2s}
.sidebar button:hover{background:#D4AF37;color:#0d0d0d}
.canvas{flex:1;position:relative;overflow:auto;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:20px 20px}
.cluster{position:absolute;min-width:300px;min-height:180px;background:rgba(30,30,30,.95);border:2px dashed #3b82f6;border-radius:16px;padding:16px;cursor:move}
.cluster[data-color=green]{border-color:#10b981}
.cluster[data-color=orange]{border-color:#f59e0b}
.cluster-title{font-weight:600;font-size:16px;color:#3b82f6;margin-bottom:12px;border-bottom:1px solid #444;padding-bottom:12px}
.cluster[data-color=green] .cluster-title{color:#10b981}
.cluster[data-color=orange] .cluster-title{color:#f59e0b}
.ideas{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
.idea{padding:8px 14px;background:#242424;border:1px solid #555;border-radius:20px;font-size:13px;cursor:grab;transition:all .2s}
.idea:hover{border-color:#D4AF37;transform:translateY(-2px)}
.idea.ai{border-style:dashed;border-color:#D4AF37;color:#D4AF37}
.input-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#1a1a1a;border:1px solid #333;border-radius:16px;z-index:50}
.input-bar input{width:400px;padding:12px 16px;border:1px solid #444;background:#242424;color:#fff;border-radius:10px;font-size:14px}
.input-bar input:focus{outline:none;border-color:#D4AF37}
.input-bar button{padding:12px 20px;border:none;background:#D4AF37;color:#0d0d0d;border-radius:10px;font-weight:600;cursor:pointer}
.fab{position:absolute;bottom:90px;right:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#D4AF37,#B8960C);border:none;color:#0d0d0d;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(212,175,55,0.4)}
.fab:hover{transform:scale(1.1)}
.parked{margin-top:20px}
.parked-item{padding:10px;margin-bottom:8px;background:#242424;border:1px solid #444;border-radius:8px;font-size:13px;color:#888;text-decoration:line-through;cursor:grab}
.parked-item:hover{border-color:#D4AF37;color:#fff;text-decoration:none}
.output-panel{position:fixed;right:-500px;top:0;width:500px;height:100%;background:#1a1a1a;border-left:1px solid #333;transition:right .3s;z-index:100;display:flex;flex-direction:column}
.output-panel.open{right:0}
.output-header{padding:20px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.output-content{flex:1;padding:20px;overflow-y:auto;white-space:pre-wrap;font-family:inherit;line-height:1.6}
.close-btn{background:none;border:none;color:#888;font-size:24px;cursor:pointer}
@media(max-width:768px){.sidebar{display:none}.input-bar input{width:250px}.output-panel{width:100%}}
</style>
</head>
<body>
<header class="header">
<div class="logo">✨ Stewart Whiteboard</div>
<div class="tabs">
<button class="tab" onclick="setMode('trace')">📐 Trace</button>
<button class="tab active" onclick="setMode('brainstorm')">💡 Brainstorm</button>
</div>
<button class="tab voice-btn" style="background:#333" onclick="toggleVoice(this)">🎤 Voice</button>
</header>
<main class="main">
<aside class="sidebar">
<h3>🎨 New Cluster</h3>
<button onclick="addCluster('blue')">+ Blue Cluster</button>
<button onclick="addCluster('green')">+ Green Cluster</button>
<button onclick="addCluster('orange')">+ Orange Cluster</button>
<h3>⚡ Actions</h3>
<button onclick="elaborate()">✨ Elaborate All</button>
<button onclick="clearAll()">🗑️ Clear Canvas</button>
<div class="parked">
<h3>🅿️ Parked Ideas</h3>
<div id="parked"></div>
</div>
</aside>
<div class="canvas" id="canvas">
<div class="cluster" data-color="blue" style="left:50px;top:50px">
<div class="cluster-title" contenteditable>Main Ideas</div>
<div class="ideas">
<span class="idea" draggable="true" ondblclick="parkIdea(this)">First thought</span>
<span class="idea" draggable="true" ondblclick="parkIdea(this)">Second idea</span>
<span class="idea ai" draggable="true" ondblclick="parkIdea(this)">🤖 AI suggestion</span>
</div>
</div>
<div class="cluster" data-color="green" style="left:420px;top:50px">
<div class="cluster-title" contenteditable>Supporting Points</div>
<div class="ideas">
<span class="idea" draggable="true" ondblclick="parkIdea(this)">Evidence A</span>
<span class="idea" draggable="true" ondblclick="parkIdea(this)">Research</span>
</div>
</div>
<div class="input-bar">
<input type="text" id="inp" placeholder="Type an idea and press Enter...">
<button onclick="addIdea()">Add</button>
</div>
<button class="fab" onclick="elaborate()" title="Elaborate">✨</button>
</div>
</main>
<div class="output-panel" id="outputPanel">
<div class="output-header">
<h3>✨ Elaborated Output</h3>
<button class="close-btn" onclick="closeOutput()">&times;</button>
</div>
<div class="output-content" id="outputContent"></div>
</div>
<script>
let clusterCount=2;
function setMode(m){document.querySelectorAll('.tabs .tab').forEach((t,i)=>{t.classList.toggle('active',i===(m==='trace'?0:1))})}
function toggleVoice(btn){btn.classList.toggle('recording')}
function addCluster(color){
  const c=document.createElement('div');
  c.className='cluster';c.setAttribute('data-color',color);
  c.style.cssText='left:'+(50+(clusterCount%3)*370)+'px;top:'+(50+Math.floor(clusterCount/3)*220)+'px';
  c.innerHTML='<div class="cluster-title" contenteditable>New Cluster</div><div class="ideas"></div>';
  makeDraggable(c);
  document.getElementById('canvas').appendChild(c);clusterCount++;
}
function addIdea(){
  const t=document.getElementById('inp').value.trim();if(!t)return;
  const i=document.createElement('span');i.className='idea';i.draggable=true;
  i.ondblclick=function(){parkIdea(this)};i.textContent=t;
  document.querySelector('.cluster .ideas').appendChild(i);
  document.getElementById('inp').value='';
}
function parkIdea(el){
  const p=document.getElementById('parked');
  const pi=document.createElement('div');pi.className='parked-item';pi.textContent=el.textContent;
  pi.ondblclick=function(){restoreIdea(this)};p.appendChild(pi);el.remove();
}
function restoreIdea(el){
  const i=document.createElement('span');i.className='idea';i.draggable=true;
  i.ondblclick=function(){parkIdea(this)};i.textContent=el.textContent;
  document.querySelector('.cluster .ideas').appendChild(i);el.remove();
}
function elaborate(){
  const clusters=document.querySelectorAll('.cluster');let output='';
  clusters.forEach((c,i)=>{
    const title=c.querySelector('.cluster-title').textContent;
    const ideas=Array.from(c.querySelectorAll('.idea')).map(e=>e.textContent);
    output+=`## ${title}\n\n`;
    if(ideas.length){
      output+=ideas.join('. ')+'.';
      output+=`\n\nThese ideas around "${title}" suggest a focus on ${ideas[0].toLowerCase()} and related concepts. `;
      output+=`Consider how ${ideas.slice(0,2).join(' and ')} might work together to form a cohesive narrative.\n\n`;
    }
  });
  document.getElementById('outputContent').textContent=output||'Add some ideas to clusters first!';
  document.getElementById('outputPanel').classList.add('open');
}
function closeOutput(){document.getElementById('outputPanel').classList.remove('open')}
function clearAll(){if(confirm('Clear all clusters?')){document.querySelectorAll('.cluster').forEach(c=>c.remove());clusterCount=0}}
function makeDraggable(el){
  let pos1=0,pos2=0,pos3=0,pos4=0;
  el.onmousedown=function(e){
    if(e.target.contentEditable==='true'||e.target.classList.contains('idea'))return;
    e.preventDefault();pos3=e.clientX;pos4=e.clientY;
    document.onmouseup=function(){document.onmouseup=null;document.onmousemove=null};
    document.onmousemove=function(e){
      e.preventDefault();pos1=pos3-e.clientX;pos2=pos4-e.clientY;pos3=e.clientX;pos4=e.clientY;
      el.style.top=(el.offsetTop-pos2)+'px';el.style.left=(el.offsetLeft-pos1)+'px';
    };
  };
}
document.querySelectorAll('.cluster').forEach(makeDraggable);
document.getElementById('inp').onkeypress=e=>{if(e.key==='Enter')addIdea()};
</script>
</body>
</html>
